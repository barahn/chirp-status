name: CI

# Everything runs on Bun (CONTRIBUTING.md). The Worker has no runtime
# dependency, so what is tested is what is deployed.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the DCO commit range have to be local.
          fetch-depth: 0
          persist-credentials: false

      # CONTRIBUTING.md requires a DCO Signed-off-by trailer on every commit.
      # It certifies where a contribution came from; it is not the CLA.
      - name: Validate DCO sign-off
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MISSING=0
          while read -r sha || [ -n "$sha" ]; do
            [ -z "$sha" ] && continue
            if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q '[^[:space:]]'; then
              echo "✓ $sha is signed off."
            else
              echo "::error::Commit $sha has no 'Signed-off-by' trailer: $(git show -s --format='%s' "$sha")"
              MISSING=1
            fi
          done < <(git log --no-merges "${BASE_SHA}..${HEAD_SHA}" --pretty=format:"%H")
          [ "$MISSING" -eq 0 ] || { echo "::error::Sign your commits with 'git commit -s'. See CONTRIBUTING.md."; exit 1; }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Licences
        run: bun run licences

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The Worker as wrangler would deploy it, without deploying it.
      - name: Build the Worker
        run: bun run build
