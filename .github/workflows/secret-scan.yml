name: Secret Scan

# A leaked credential is not a build failure anywhere else in this pipeline:
# the code compiles, the tests pass, and the secret is in the history for good.
# Rotation is the only remedy after the fact, so the gate runs before the merge.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '41 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Audit mode: harden-runner records what each job talks to without
      # blocking it. Read the egress report on a few green runs, then turn this
      # to `block` with an allowlist -- flipping it blind breaks the module
      # proxy, the linter and the action downloads all at once.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        # An observer must not be able to fail the build it observes. In audit
        # mode this step blocks nothing, so if the agent cannot start -- as on a
        # private repository its tier does not cover -- the job goes on without
        # the egress report rather than going red.
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed by a later commit is still published.
          # Both ends of the range have to be local for the PR scan below.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      # Run gitleaks as a pinned Go module rather than through its action, as
      # Chirp does: the action's v3 is licence-gated for organisations.
      - name: Scan commits (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.0 git \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact --no-banner --exit-code 1 .

      - name: Scan working tree and history
        if: github.event_name != 'pull_request'
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.0 dir . \
            --redact --no-banner --exit-code 1
          go run github.com/zricethezav/gitleaks/v8@v8.30.0 git \
            --redact --no-banner --exit-code 1 .
